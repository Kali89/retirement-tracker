[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fire-tracker"
version = "0.1.0"
description = "A CLI tool for tracking progress towards FIRE (Financial Independence, Retire Early)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
fire = "fire_tracker.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
